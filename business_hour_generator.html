
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Business Hours Tag Generator</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 25px;
    font-family: Arial, sans-serif;
    background: #111827;
    color: #e5e7eb;
}

.container {
    max-width: 950px;
    margin: auto;
}

h2 {
    margin: 0 0 8px;
    color: #f9fafb;
}

.description {
    color: #9ca3af;
    margin-bottom: 22px;
    line-height: 1.5;
}

.location-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.location {
    display: flex;
    align-items: center;
    gap: 10px;
}

.location-number {
    min-width: 30px;
    font-weight: bold;
    color: #64748b;
}

.location input {
    flex: 1;
    min-width: 0;
    padding: 12px;
    background: #1f2937;
    border: 1px solid #374151;
    border-radius: 6px;
    color: #f9fafb;
    font-size: 14px;
    outline: none;
}

.location input:focus {
    border-color: #3b82f6;
}

button {
    padding: 11px 15px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
    transition: .2s;
}

button:hover {
    filter: brightness(1.15);
}

.remove {
    background: #451f27;
    color: #fca5a5;
}

.add {
    background: #263548;
    color: #bfdbfe;
}

.generate, .copy {
    background: #2563eb;
    color: white;
}

.actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin: 20px 0;
}

.output-container {
    background: #1f2937;
    border: 1px solid #374151;
    border-radius: 9px;
    padding: 18px;
    margin-top: 25px;
}

.output-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 15px;
}

.output-header h3 {
    margin: 0;
    color: #f9fafb;
}

.output-hint {
    color: #9ca3af;
    font-size: 12px;
    margin-bottom: 15px;
}

.tag-section {
    margin-bottom: 22px;
}

.tag-location {
    font-size: 14px;
    font-weight: bold;
    color: #93c5fd;
    margin-bottom: 12px;
    padding-bottom: 9px;
    border-bottom: 1px solid #374151;
}

.tag-day {
    margin-bottom: 13px;
}

.day-name {
    color: #9ca3af;
    font-size: 12px;
    font-weight: bold;
    margin-bottom: 7px;
    text-transform: uppercase;
}

.tag-pair {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
}

.tag {
    display: inline-block;
    background: #111827;
    border: 1px solid #374151;
    color: #a7f3d0;
    border-radius: 5px;
    padding: 9px 11px;
    font-family: Consolas, monospace;
    font-size: 12px;
    cursor: pointer;
    word-break: break-all;
    transition: .2s;
}

.tag:hover {
    background: #263548;
    border-color: #3b82f6;
    color: #bfdbfe;
}

.tag.copied {
    background: #064e3b;
    border-color: #10b981;
    color: #6ee7b7;
}

.toast {
    position: fixed;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #065f46;
    color: #d1fae5;
    padding: 12px 20px;
    border-radius: 7px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: .25s;
    z-index: 9999;
}

.toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

.empty {
    color: #9ca3af;
    padding: 20px 0;
    text-align: center;
}

@media(max-width: 600px) {
    body {
        padding: 14px;
    }

    .output-header {
        align-items: flex-start;
        flex-direction: column;
    }

    .tag-pair {
        flex-direction: column;
    }

    .tag {
        width: 100%;
    }
}
</style>
</head>

<body>

<div class="container">

    <h2>Business Hours Tag Generator</h2>

    <p class="description">
        Add your website locations in order. Click any generated tag to
        automatically copy it to your clipboard.
    </p>

    <div class="location-list" id="locationList"></div>

    <div class="actions">
        <button class="add" onclick="addLocation()">+ Add Location</button>
        <button class="generate" onclick="generateTags()">Generate Tags</button>
    </div>

    <div class="output-container">

        <div class="output-header">
            <h3>Generated Tags</h3>
            <button class="copy" onclick="copyAll()">Copy All Tags</button>
        </div>

        <div class="output-hint">
            <span>Click an individual tag to copy it.</span>
        </div>

        <div id="generatedTags">
            <div class="empty">No tags generated yet.</div>
        </div>

    </div>

</div>

<div class="toast" id="toast">Tag copied!</div>

<script>

const days = [
    "Monday",
    "Tuesday",
    "Wednesday",
    "Thursday",
    "Friday",
    "Saturday",
    "Sunday"
];

const locationList = document.getElementById("locationList");

function addLocation(name = "") {

    const location = document.createElement("div");
    location.className = "location";

    const number = document.createElement("span");
    number.className = "location-number";

    const input = document.createElement("input");
    input.type = "text";
    input.placeholder = "Enter location name";
    input.value = name;

    input.addEventListener("input", generateTags);

    const remove = document.createElement("button");
    remove.className = "remove";
    remove.textContent = "Remove";

    remove.onclick = () => {
        location.remove();
        updateNumbers();
        generateTags();
    };

    location.append(number, input, remove);

    locationList.appendChild(location);

    updateNumbers();
}

function updateNumbers() {

    document.querySelectorAll(".location").forEach((location, index) => {
        location.querySelector(".location-number").textContent =
            (index + 1) + ".";
    });
}

function generateTags() {

    const locations = document.querySelectorAll(".location");
    const container = document.getElementById("generatedTags");

    container.innerHTML = "";

    if (!locations.length) {
        container.innerHTML = '<div class="empty">Add a location to generate tags.</div>';
        return;
    }

    locations.forEach((location, locationIndex) => {

        const locationName =
            location.querySelector("input").value.trim()
            || `Location ${locationIndex + 1}`;

        const index = locationIndex + 1;

        const section = document.createElement("div");
        section.className = "tag-section";

        const heading = document.createElement("div");
        heading.className = "tag-location";
        heading.textContent = `${locationName} — Location ${index}`;

        section.appendChild(heading);

        days.forEach((day, dayIndex) => {

            const weekdayIndex = dayIndex + 1;

            const dayContainer = document.createElement("div");
            dayContainer.className = "tag-day";

            const dayHeading = document.createElement("div");
            dayHeading.className = "day-name";
            dayHeading.textContent = day;

            const pair = document.createElement("div");
            pair.className = "tag-pair";

            const openTag =
                `{:HOURS.${index}.WEEKDAYS.${weekdayIndex}.SCHEDULE.1.TIME_OPEN:}`;

            const closeTag =
                `{:HOURS.${index}.WEEKDAYS.${weekdayIndex}.SCHEDULE.1.TIME_CLOSE:}`;

            [openTag, closeTag].forEach(tagText => {

                const tag = document.createElement("span");
                tag.className = "tag";
                tag.textContent = tagText;
                tag.title = "Click to copy";

                tag.addEventListener("click", () => {
                    copyText(tagText, tag);
                });

                pair.appendChild(tag);
            });

            dayContainer.append(dayHeading, pair);
            section.appendChild(dayContainer);

        });

        container.appendChild(section);

    });
}

async function copyText(text, element = null) {

    try {
        await navigator.clipboard.writeText(text);
    } catch (error) {
        const textarea = document.createElement("textarea");
        textarea.value = text;
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand("copy");
        textarea.remove();
    }

    if (element) {
        element.classList.add("copied");
        setTimeout(() => element.classList.remove("copied"), 900);
    }

    showToast("Tag copied to clipboard!");
}

async function copyAll() {

    const tags = [];

    document.querySelectorAll(".tag-section").forEach(section => {

        tags.push(section.querySelector(".tag-location").textContent);
        tags.push("");

        section.querySelectorAll(".tag-day").forEach(day => {

            const dayName = day.querySelector(".day-name").textContent;

            tags.push("--- " + dayName + " ---");

            day.querySelectorAll(".tag").forEach(tag => {
                tags.push(tag.textContent);
            });

            tags.push("");Location 2
        });

        tags.push("");
    });

    if (!tags.length) return;

    await copyText(tags.join("\n"));
}

function showToast(message) {

    const toast = document.getElementById("toast");

    toast.textContent = message;
    toast.classList.add("show");

    clearTimeout(window.toastTimer);

    window.toastTimer = setTimeout(() => {
        toast.classList.remove("show");
    }, 1600);
}

// Initial locations
addLocation("Washburn");
addLocation("Location 2");
addLocation("Location 3");

generateTags();

</script>

</body>
</html>
