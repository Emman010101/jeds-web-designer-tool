
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Business Hours Tag Generator</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 25px;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #263238;
}

.container {
    max-width: 850px;
    margin: auto;
}

h2 {
    margin: 0 0 8px;
}

.description {
    color: #64748b;
    margin-bottom: 22px;
    line-height: 1.5;
}

.location-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.location {
    display: flex;
    align-items: center;
    gap: 10px;
}

.location-number {
    min-width: 30px;
    font-weight: bold;
    color: #64748b;
}

.location input {
    flex: 1;
    min-width: 0;
    padding: 12px;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    font-size: 14px;
}

button {
    padding: 11px 15px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
}

.remove {
    background: #fee2e2;
    color: #b91c1c;
}

.add {
    background: #e2e8f0;
    color: #334155;
}

.generate, .copy {
    background: #2563eb;
    color: white;
}

.actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin: 20px 0;
}

.output-container {
    background: white;
    border: 1px solid #dce3e8;
    border-radius: 8px;
    padding: 18px;
    margin-top: 25px;
}

.output-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
}

.output-header h3 {
    margin: 0;
}

textarea {
    width: 100%;
    min-height: 350px;
    resize: vertical;
    padding: 14px;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    font-family: Consolas, monospace;
    font-size: 13px;
    line-height: 1.6;
    background: #f8fafc;
}

@media(max-width: 500px) {
    body {
        padding: 14px;
    }

    .output-header {
        align-items: flex-start;
        flex-direction: column;
    }
}
</style>
</head>

<body>

<div class="container">

    <h2>Business Hours Tag Generator</h2>
    <p class="description">
        Add your website locations in order. Tags will automatically
        use the correct location index.
    </p>

    <div class="location-list" id="locationList"></div>

    <div class="actions">
        <button class="add" onclick="addLocation()">+ Add Location</button>
        <button class="generate" onclick="generateTags()">Generate Tags</button>
    </div>

    <div class="output-container">

        <div class="output-header">
            <h3>Generated Tags</h3>
            <button class="copy" onclick="copyTags()">Copy All</button>
        </div>

        <textarea id="output" readonly
            placeholder="Generated tags will appear here..."></textarea>

    </div>

</div>

<script>

const days = [
    "Monday",
    "Tuesday",
    "Wednesday",
    "Thursday",
    "Friday",
    "Saturday",
    "Sunday"
];

const locationList = document.getElementById("locationList");

function addLocation(name = "") {

    const location = document.createElement("div");
    location.className = "location";

    const number = document.createElement("span");
    number.className = "location-number";

    const input = document.createElement("input");
    input.type = "text";
    input.placeholder = "Enter location name";
    input.value = name;

    const remove = document.createElement("button");
    remove.className = "remove";
    remove.textContent = "Remove";

    remove.onclick = () => {
        location.remove();
        updateNumbers();
    };

    location.append(number, input, remove);

    locationList.appendChild(location);

    updateNumbers();
}

function updateNumbers() {

    document.querySelectorAll(".location").forEach((location, index) => {
        location.querySelector(".location-number").textContent =
            (index + 1) + ".";
    });
}

function generateTags() {

    const locations = document.querySelectorAll(".location");

    let tags = [];

    locations.forEach((location, locationIndex) => {

        const locationName =
            location.querySelector("input").value.trim()
            || `Location ${locationIndex + 1}`;

        const index = locationIndex + 1;

        tags.push("========================================");
        tags.push(`${locationName} - Location ${index}`);
        tags.push("========================================");
        tags.push("");

        days.forEach((day, dayIndex) => {

            const weekdayIndex = dayIndex + 1;

            tags.push(`--- ${day} ---`);

            tags.push(
                `{:HOURS.${index}.WEEKDAYS.${weekdayIndex}.SCHEDULE.1.TIME_OPEN:}`
            );

            tags.push(
                `{:HOURS.${index}.WEEKDAYS.${weekdayIndex}.SCHEDULE.1.TIME_CLOSE:}`
            );

            tags.push("");
        });

        tags.push("");
    });

    document.getElementById("output").value = tags.join("\n");
}

async function copyTags() {

    const output = document.getElementById("output");

    if (!output.value.trim()) {
        generateTags();
    }

    try {
        await navigator.clipboard.writeText(output.value);
        alert("All tags copied successfully!");
    } catch (error) {
        output.select();
        document.execCommand("copy");
        alert("All tags copied successfully!");
    }
}

// Default locations
addLocation("Washburn");
addLocation("Location 2");
addLocation("Location 3");

generateTags();

</script>

</body>
</html>
