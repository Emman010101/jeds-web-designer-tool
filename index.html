    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, function (char) {
        return {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        }[char];
      });
    }

    function defaultSitemap() {
      const match = location.pathname.match(/\/(\d{5,})(?:\/|$)/);

      if (match) {

      return `${location.origin}/sitemap.xml`;

    function countOccurrences(text, term) {
      if (!text || !term) return 0;

      const escaped = term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      const matches = text.match(new RegExp(escaped, "gi"));

      return matches ? matches.length : 0;
    }

    function makeSnippet(text, term) {
      if (!text || !term) return "";

      const index = text.toLowerCase().indexOf(term.toLowerCase());

      if (index < 0) return "";

      const start = Math.max(0, index - 65);
      const end = Math.min(text.length, index + term.length + 100);

      return text.slice(start, end).replace(/\s+/g, " ").trim();
    }

    function normalizePageUrl(raw, base) {
      try {
        const url = new URL(raw, base || location.href);

        if (!["http:", "https:"].includes(url.protocol)) {
          return null;
        }

        url.hash = "";

        if (/\.(jpg|jpeg|png|gif|webp|svg|ico|pdf|css|js|zip|woff2?|mp4|mp3|xml)$/i.test(url.pathname)) {
          return null;
        }

        return url.href;
      } catch (error) {
        return null;
      }
    }

    /*
     * Cross-domain requests use CORS mode and omit credentials.
     * Same-origin requests retain normal same-origin credentials.
     *
     * IMPORTANT:
     * This does not bypass CORS. The remote server must allow
     * the CMS origin through Access-Control-Allow-Origin.
     */

    async function fetchResource(rawUrl, resourceType) {
      const url = new URL(rawUrl);
      const sameOrigin = url.origin === location.origin;
      const controller = new AbortController();

      const timeout = window.setTimeout(
        () => controller.abort(),
        25000
      );

      try {
        const accept = resourceType === "xml"
          ? "application/xml,text/xml,text/plain,*/*"
          : "text/html,application/xhtml+xml,*/*";

        const response = await fetch(url.href, {
          method: "GET",
          mode: "cors",
          credentials: sameOrigin ? "same-origin" : "omit",
          redirect: "follow",
          cache: "no-store",
          signal: controller.signal,
          headers: {
            "Accept": accept
          }
        });

        if (!response.ok) {
          throw new Error(
            `HTTP ${response.status} ${response.statusText || ""} at ${url.href}`
          );
        }

        const text = await response.text();

        return {
          text: text,
          finalUrl: response.url || url.href,
          status: response.status
        };

      } catch (error) {
        const message = String(error.message || error);

        if (message.startsWith("HTTP ")) {
          throw error;
        }

        if (error.name === "AbortError") {
          throw new Error(`Request timed out after 25 seconds: ${url.href}`);
        }

        if (!sameOrigin) {
          throw new Error(
            `Cross-domain request failed for ${url.origin}. ` +
            `The browser could not read the response. This may be a CORS, ` +
            `DNS, TLS, or network restriction. If the URL opens normally in ` +
            `a browser tab, ask the remote server to allow ${location.origin} ` +
            `using the Access-Control-Allow-Origin response header. ` +
            `Browser message: ${message}`
          );
        }

        throw new Error(
          `Request failed for ${url.href}. Browser message: ${message}`
        );

      } finally {
        window.clearTimeout(timeout);
      }
    }

    async function readSitemap(rawUrl, depth) {
      if (state.stop) return;

      if (depth > 6) {
        throw new Error("Sitemap nesting exceeded the maximum depth of 6.");
      }

      const sitemapUrl = new URL(rawUrl, location.href).href;

      if (state.sitemapFiles.includes(sitemapUrl)) {
        return;
      }

      if (state.sitemapFiles.length >= 100) {
        throw new Error("Maximum of 100 sitemap files reached.");
      }

      state.sitemapFiles.push(sitemapUrl);

      setStatus(`Reading sitemap: ${sitemapUrl}`);

      const response = await fetchResource(sitemapUrl, "xml");

      const xml = new DOMParser().parseFromString(
        response.text,
        "application/xml"
      );

      if (xml.querySelector("parsererror")) {
        throw new Error(
          `Invalid XML response from ${sitemapUrl}. The server may be returning HTML instead of a sitemap.`
        );
      }

      const rootName = (
        xml.documentElement.localName ||
        xml.documentElement.nodeName ||
        ""
      ).toLowerCase();

      let locNodes = Array.from(
        xml.getElementsByTagNameNS("*", "loc")
      );

      if (!locNodes.length) {
        locNodes = Array.from(xml.getElementsByTagName("loc"));
      }

      const locations = locNodes
        .map(node => node.textContent.trim())
        .filter(Boolean);

      if (rootName.includes("sitemapindex")) {
        for (const childSitemap of locations) {
          if (state.stop) break;

          const childUrl = new URL(
            childSitemap,
            response.finalUrl
          ).href;

          try {
            await readSitemap(childUrl, depth + 1);
          } catch (error) {
            state.errors.push(
              `Nested sitemap ${childUrl}: ${error.message}`
            );
          }
        }

      } else if (rootName.includes("urlset")) {
        for (const location of locations) {
          const pageUrl = normalizePageUrl(
            location,
            response.finalUrl
          );

          if (pageUrl) {
            state.pageSet.add(pageUrl);
          }
        }

      } else {
        throw new Error(
          `Unsupported sitemap XML root "${rootName}" at ${sitemapUrl}. Expected sitemapindex or urlset.`
        );
      }
    }

          issues.push(`Long title (${title.length} characters)`);
        }

        if (!description) {

        } else if (description.length > 160) {
          issues.push(`Long meta desc
