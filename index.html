    const $ = selector => shadow.querySelector(selector);

    const state = {
      scanning: false,
      stop: false,
      tab: "overview",

      pageSet: new Set(),

    // ==========================================
    // PART 2: UTILITY FUNCTIONS + FETCHING
    // ==========================================

    function escapeHTML(value) {
        return String(value ?? "").replace(/[&<>"']/g, char => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        })[char]);
    }

    function storageGet(key, fallback = null) {
        try {
            const value = localStorage.getItem(key);
            return value === null ? fallback : JSON.parse(value);
        } catch (error) {
            return fallback;
        }
    }

    function storageSet(key, value) {
        try {
            localStorage.setItem(key, JSON.stringify(value));
        } catch (error) {
            console.warn("Could not save auditor setting:", error);
        }
    }

    function defaultSitemap() {
        const current = $("#sitemap")?.value?.trim();

        if (current) {
            return current;
        }

        return new URL("/sitemap.xml", window.location.href).href;
    }

    function setStatus(message, type = "info") {
        const status = $("#status");

        if (!status) return;

        status.textContent = message;
        status.dataset.type = type;
    }

    function setProgress(current, total, label = "") {
        const fill = $("#progressFill");
        const text = $("#progressText");

        const safeTotal = Math.max(1, Number(total) || 1);
        const safeCurrent = Math.max(0, Number(current) || 0);
        const percentage = Math.min(
            100,
            Math.round((safeCurrent / safeTotal) * 100)
        );

        if (fill) {
            fill.style.width = percentage + "%";
        }

        if (text) {
            text.textContent = label
                ? `${label} — ${safeCurrent}/${safeTotal}`
                : `${percentage}%`;
        }
    }

    function setBusy(busy) {
        const start = $("#start");
        const stop = $("#stop");
        const exportButton = $("#export");

        if (start) start.disabled = busy;
        if (stop) stop.disabled = !busy;
        if (exportButton) {
            exportButton.disabled = busy || state.pageResults.length === 0;
        }

        state.scanning = busy;
    }

    function countOccurrences(text, searchTerm) {
        if (!text || !searchTerm) return 0;

        const source = String(text).toLowerCase();
        const term = String(searchTerm).toLowerCase();

        let count = 0;
        let position = 0;

        while (true) {
            position = source.indexOf(term, position);

            if (position === -1) break;

            count++;
            position += term.length;
        }

        return count;
    }

    function makeSnippet(text, searchTerm = "", length = 180) {
        const content = String(text || "").replace(/\s+/g, " ").trim();

        if (!content) return "";

        if (!searchTerm) {
            return content.length > length
                ? content.slice(0, length) + "..."
                : content;
        }

        const index = content.toLowerCase().indexOf(
            String(searchTerm).toLowerCase()
        );

        if (index === -1) {
            return content.length > length
                ? content.slice(0, length) + "..."
                : content;
        }

        const start = Math.max(0, index - Math.floor(length / 3));
        const end = Math.min(content.length, start + length);

        return (start > 0 ? "..." : "") +
            content.slice(start, end) +
            (end < content.length ? "..." : "");
    }

    function normalizePageUrl(raw, base) {
        try {
            const url = new URL(raw, base);

            if (!["http:", "https:"].includes(url.protocol)) {
                return null;
            }

            url.hash = "";

            // Remove common tracking parameters.
            const trackingParams = [
                "utm_source",
                "utm_medium",
                "utm_campaign",
                "utm_term",
                "utm_content",
                "gclid",
                "fbclid",
                "msclkid"
            ];

            trackingParams.forEach(param => {
                url.searchParams.delete(param);
            });

            return url.href;
        } catch (error) {
            return null;
        }
    }

    // ==========================================
    // CLOUDFLARE WORKER PROXY
    // ==========================================

    function getProxyEndpoint() {
        const input = $("#proxyUrl");
        const saved = storageGet(PROXY_KEY, "");

        const value = String(
            input?.value?.trim() || saved || ""
        ).trim();

        if (value && input) {
            storageSet(PROXY_KEY, value);
        }

        return value.replace(/\/+$/, "");
    }

    async function fetchTarget(rawUrl, resourceType = "page") {
        const targetUrl = normalizePageUrl(
            rawUrl,
            window.location.href
        );

        if (!targetUrl) {
            throw new Error("Invalid or unsupported URL: " + rawUrl);
        }

        const proxyEndpoint = getProxyEndpoint();

        let requestUrl = targetUrl;

        // Route the request through the Cloudflare Worker
        // when a proxy URL has been configured.
        if (proxyEndpoint) {
            let proxyUrl;

            try {
                proxyUrl = new URL(proxyEndpoint);
            } catch (error) {
                throw new Error("Invalid Cloudflare Worker URL.");
            }

            if (proxyUrl.protocol !== "https:") {
                throw new Error("The Cloudflare Worker URL must use HTTPS.");
            }

            proxyUrl.searchParams.set("url", targetUrl);
            requestUrl = proxyUrl.href;
        }

        const acceptHeader = resourceType === "sitemap"
            ? "application/xml, text/xml, application/rss+xml, */*"
            : "text/html, application/xhtml+xml, */*";

        let response;

        try {
            response = await fetch(requestUrl, {
                method: "GET",
                mode: "cors",
                credentials: "omit",
                cache: "no-store",
                redirect: "follow",
                headers: {
                    "Accept": acceptHeader
                }
            });
        } catch (error) {
            if (!proxyEndpoint) {
                throw new Error(
                    "Failed to fetch. This website may block cross-origin " +
                    "requests. Configure your Cloudflare Worker URL."
                );
            }

            throw new Error(
                "Cloudflare Worker request failed: " +
                (error.message || "Network or CORS error")
            );
        }

        if (!response.ok) {
            throw new Error(
                `Request failed (${response.status}) for ${targetUrl}`
            );
        }

        return response;
    }

    async function fetchResource(rawUrl, resourceType = "page") {
        return await fetchTarget(rawUrl, resourceType);
    }

    // ==========================================
    // SITEMAP READER
    // Supports sitemap.xml and sitemap indexes
    // ==========================================

    async function readSitemap(rawUrl, depth = 0) {
        if (state.stop) return;

        const MAX_DEPTH = 5;

        if (depth > MAX_DEPTH) {
            state.errors.push({
                url: rawUrl,
                error: "Maximum sitemap nesting depth reached."
            });
            return;
        }

        const sitemapUrl = normalizePageUrl(
            rawUrl,
            window.location.href
        );

        if (!sitemapUrl) {
            state.errors.push({
                url: rawUrl,
                error: "Invalid sitemap URL."
            });
            return;
        }

        if (state.sitemapFiles.has(sitemapUrl)) {
            return;
        }

        state.sitemapFiles.add(sitemapUrl);

        try {
            const response = await fetchResource(
                sitemapUrl,
                "sitemap"
            );

            const xmlText = await response.text();

            if (!xmlText.trim()) {
                throw new Error("The sitemap returned an empty response.");
            }

            const parser = new DOMParser();
            const xml = parser.parseFromString(
                xmlText,
                "application/xml"
            );

            if (xml.querySelector("parsererror")) {
                throw new Error("Invalid XML sitemap.");
            }

            const root = xml.documentElement;
            const rootName = (
                root?.localName ||
                root?.nodeName ||
                ""
            ).toLowerCase();

            const locations = Array.from(
                xml.getElementsByTagName("*")
            )
                .filter(node =>
                    (node.localName || node.nodeName).toLowerCase() === "loc"
                )
                .map(node => node.textContent.trim())
                .filter(Boolean);

            if (!locations.length) {
                throw new Error("No URLs were found in this sitemap.");
            }

            const isSitemapIndex =
                rootName.includes("sitemapindex") ||
                rootName.includes("sitemap-index");

            if (isSitemapIndex) {
                for (const childSitemap of locations) {
                    if (state.stop) break;

                    const maxPages = Number(state.maxPages) || 500;

                    if (state.pageSet.size >= maxPages) {
                        break;
                    }

                    await readSitemap(childSitemap, depth + 1);
                }

                return;
            }

            const maxPages = Number(state.maxPages) || 500;

            for (const location of locations) {
                if (state.stop) break;

                if (state.pageSet.size >= maxPages) {
                    break;
                }

                const pageUrl = normalizePageUrl(
                    location,
                    sitemapUrl
                );

                if (!pageUrl) continue;

                if (!state.pageSet.has(pageUrl)) {
                    state.pageSet.add(pageUrl);
                    state.discoveredCount++;
                }
            }

        } catch (error) {
            state.errors.push({
                url: sitemapUrl,
                error: error.message || "Unknown sitemap error."
            });
        }
    }

    // ==========================================
    // PART 3: PAGE SCANNING + INTERNAL LINKS
    // ==========================================

    // Make sure all result collections are available.
    state.pageResults ||= [];
    state.linkResults ||= [];
    state.keywordResults ||= [];
    state.replaceResults ||= [];
    state.errors ||= [];

    state.sitemapFiles ||= new Set();
    state.pageSet ||= new Set();
    state.internalLinks ||= new Map();

    if (!(state.sitemapFiles instanceof Set)) {
        state.sitemapFiles = new Set(state.sitemapFiles);
    }

    if (!(state.pageSet instanceof Set)) {
        state.pageSet = new Set(state.pageSet);
    }

    if (!(state.internalLinks instanceof Map)) {
        state.internalLinks = new Map();
    }

    state.scannedCount ||= 0;

    // ==========================================
    // READ KEYWORDS
    // ==========================================

    function getKeywords() {
        const input = $("#keywords");

        if (!input) return [];

        return [...new Set(
            input.value
                .split(/[\n,;]+/)
                .map(keyword => keyword.trim())
                .filter(Boolean)
        )];
    }

    function getFindReplaceValues() {
        const findInput =
            $("#findText") ||
            $("#find");

            find: findInput?.value?.trim() || "",

    }

    // ==========================================
    // EXTRACT PAGE INFORMATION
    // ==========================================

    function extractPageData(html, pageUrl) {
        const parser = new DOMParser();

        const doc = parser.parseFromString(
            html,
            "text/html"
        );

        const title =
            doc.querySelector("title")?.textContent?.trim() || "";

        const metaDescription =
            doc.querySelector('meta[name="description"]')
                ?.getAttribute("content")
                ?.trim() || "";

        const canonicalElement =
            doc.querySelector('link[rel="canonical"]');

        const canonical = canonicalElement
            ? normalizePageUrl(
                canonicalElement.getAttribute("href"),
                pageUrl
            )
            : "";

        const robots =
            doc.querySelector('meta[name="robots"]')
                ?.getAttribute("content")
                ?.trim() || "";

        const headings = {};

        for (let level = 1; level <= 6; level++) {
            const elements = Array.from(
                doc.querySelectorAll(`h${level}`)
            );

            headings[`h${level}`] = elements.map(element =>
                element.textContent.trim()
            );
        }

        const h1Count = headings.h1.length;

        const images = Array.from(
            doc.querySelectorAll("img")
        ).map(image => ({
            src: normalizePageUrl(
                image.getAttribute("src") ||
                image.getAttribute("data-src") ||
                "",
                pageUrl
            ) || image.getAttribute("src") || "",

            alt: image.getAttribute("alt") || "",

            hasAlt: image.hasAttribute("alt") &&
                image.getAttribute("alt").trim() !== ""
        }));

        const body = doc.body || doc.documentElement;

        // Remove elements that should not contribute to content analysis.
        body.querySelectorAll(
            "script, style, noscript, svg, iframe"
        ).forEach(element => element.remove());

        const textContent = (body.textContent || "")
            .replace(/\s+/g, " ")
            .trim();

        const wordCount = textContent
            ? textContent.split(/\s+/).length
            : 0;

        const pageUrlObject = new URL(pageUrl);

        const internalLinks = Array.from(
            doc.querySelectorAll("a[href]")
        )
            .map(anchor => {
                const href = anchor.getAttribute("href");

                if (!href) return null;

                const normalized = normalizePageUrl(
                    href,
                    pageUrl
                );

                if (!normalized) return null;

                let linkUrl;

                try {
                    linkUrl = new URL(normalized);
                } catch (error) {
                    return null;
                }

                if (linkUrl.origin !== pageUrlObject.origin) {
                    return null;
                }

                return {
                    url: normalized,
                    text: anchor.textContent.trim(),
                    sourcePage: pageUrl
                };
            })
            .filter(Boolean);

        return {
            url: pageUrl,
            title,
            metaDescription,
            canonical,
            robots,
            noindex: /noindex/i.test(robots),
            headings,
            h1Count,
            images,
            imageCount: images.length,
            missingAltCount: images.filter(
                image => !image.hasAlt
            ).length,
            wordCount,
            textContent,
            internalLinks
        };
    }

    // ==========================================
    // KEYWORD OCCURRENCE ANALYSIS
    // ==========================================

    function analyzeKeywords(pageData) {
        const keywords = getKeywords();

        if (!keywords.length) return;

        keywords.forEach(keyword => {
            const occurrences = countOccurrences(
                pageData.textContent,
                keyword
            );

            state.keywordResults.push({
                url: pageData.url,
                keyword,
                occurrences,
                snippet: occurrences
                    ? makeSnippet(
                        pageData.textContent,
                        keyword
                    )
                    : ""
            });
        });
    }

    // ==========================================
    // FIND AND REPLACE ANALYSIS
    // ==========================================

    function analyzeFindReplace(pageData) {
        const values = getFindReplaceValues();

        if (!values.find) return;

        const occurrences = countOccurrences(
            pageData.textContent,
            values.find
        );

        if (!occurrences) return;

        const escapedFind = values.find.replace(
            /[.*+?^${}()|[\]\\]/g,
            "\\$&"
        );

        const preview = pageData.textContent.replace(
            new RegExp(escapedFind, "gi"),
            values.replace
        );

        state.replaceResults.push({
            url: pageData.url,
            find: values.find,
            replace: values.replace,
            occurrences,
            preview: makeSnippet(preview)
        });
    }

    // ==========================================
    // SCAN ONE PAGE
    // ==========================================

    async function scanPage(pageUrl) {
        if (state.stop) return null;

        try {
            const response = await fetchResource(
                pageUrl,
                "page"
            );

            const contentType =
                response.headers.get("content-type") || "";

            if (
                contentType &&
                !/html|xhtml/i.test(contentType)
            ) {
                throw new Error(
                    "URL did not return an HTML document."
                );
            }

            const html = await response.text();

            if (!html.trim()) {
                throw new Error("The page returned empty content.");
            }

            const pageData = extractPageData(
                html,
                response.url || pageUrl
            );

            state.pageResults.push(pageData);

            analyzeKeywords(pageData);
            analyzeFindReplace(pageData);

            // Collect unique internal links for later checking.
            pageData.internalLinks.forEach(link => {
                if (!state.internalLinks.has(link.url)) {
                    state.internalLinks.set(link.url, {
                        url: link.url,
                        sourcePages: [link.sourcePage],
                        anchorText: link.text
                    });
                } else {
                    const existing = state.internalLinks.get(
                        link.url
                    );

                    if (
                        !existing.sourcePages.includes(
                            link.sourcePage
                        )
                    ) {
                        existing.sourcePages.push(
                            link.sourcePage
                        );
                    }
                }
            });

            state.scannedCount++;

            return pageData;

        } catch (error) {
            state.errors.push({
                url: pageUrl,
                error: error.message || "Page scanning failed."
            });

            return null;
        }
    }

    // ==========================================
    // CONCURRENT TASK RUNNER
    // ==========================================

    async function runPool(items, concurrency, callback) {
        let index = 0;

        const workers = Array.from(
            {
                length: Math.min(
                    concurrency,
                    items.length
                )
            },
            async () => {
                while (!state.stop) {
                    const currentIndex = index++;

                    if (currentIndex >= items.length) {
                        break;
                    }

                    await callback(
                        items[currentIndex],
                        currentIndex
                    );
                }
            }
        );

        await Promise.all(workers);
    }

    // ==========================================
    // CHECK INTERNAL LINKS
    // ==========================================

    async function checkInternalLinks() {
        const links = Array.from(
            state.internalLinks.values()
        );

        if (!links.length) return;

        let checked = 0;

        await runPool(
            links,
            5,
            async link => {
                if (state.stop) return;

                const result = {
                    url: link.url,
                    sourcePages: link.sourcePages,
                    anchorText: link.anchorText,
                    status: "Unknown",
                    broken: false,
                    error: ""
                };

                try {
                    const response = await fetchResource(
                        link.url,
                        "page"
                    );

                    result.status = response.status;

                    if (!response.ok) {
                        result.broken = true;
                        result.error =
                            `HTTP ${response.status}`;
                    }

                } catch (error) {
                    result.broken = true;
                    result.status = "Failed";
                    result.error =
                        error.message || "Request failed.";
                }

                state.linkResults.push(result);

                checked++;

                setProgress(
                    checked,
                    links.length,
                    "Checking internal links"
                );
            }
        );
    }

    // ==========================================
    // RESULT SUMMARY HELPERS
    // ==========================================

    function getPageSummary() {
        const pages = state.pageResults;

        return {
            total: pages.length,

            missingTitles: pages.filter(
                page => !page.title
            ).length,

            missingDescriptions: pages.filter(
                page => !page.metaDescription
            ).length,

            multipleH1: pages.filter(
                page => page.h1Count > 1
            ).length,

            missingH1: pages.filter(
                page => page.h1Count === 0
            ).length,

            missingImageAlt: pages.reduce(
                (total, page) =>
                    total + page.missingAltCount,
                0
            ),

            noindex: pages.filter(
                page => page.noindex
            ).length,

            brokenLinks: state.linkResults.filter(
                link => link.broken
            ).length
        };
    }

        const summary = getPageSummary();

        const entry = {
            date: new Date().toISOString(),

            sitemap: $("#sitemap")?.value?.trim() || "",

            pagesScanned: state.pageResults.length,

            linksChecked: state.linkResults.length,

            brokenLinks: summary.brokenLinks,

            missingDescriptions: summary.missingDescriptions,

            missingH1: summary.missingH1,

            multipleH1: summary.multipleH1,

            missingImageAlt: summary.missingImageAlt,

            errors: state.errors.length
        };

        state.history.unshift(entry);

        // Keep the latest 30 audit records.
        state.history = state.history.slice(0, 30);

    // ==========================================
    // CSV EXPORT HELPERS
    // ==========================================

    function csvEscape(value) {
        const text = String(value ?? "");

        return '"' + text.replace(/"/g, '""') + '"';
    }

    function downloadCSV(filename, headers, rows) {
        const csv = [
            headers.map(csvEscape).join(","),

            ...rows.map(row =>
                row.map(csvEscape).join(",")
            )
        ].join("\r\n");

        const blob = new Blob(
            ["\uFEFF" + csv],
            {
                type: "text/csv;charset=utf-8;"
            }
        );

        const url = URL.createObjectURL(blob);

        const anchor = document.createElement("a");

        anchor.href = url;
        anchor.download = filename;

        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();

        setTimeout(() => {
            URL.revokeObjectURL(url);
        }, 1000);
    }

    // ==========================================
    // EXPORT CURRENT RESULTS
    // ==========================================

    function exportResults() {
        const tab = state.activeTab;

        if (
            !state.pageResults.length &&
            !state.linkResults.length
        ) {
            setStatus(
                "There are no results to export.",
                "warning"
            );
            return;
        }

        const timestamp = new Date()
            .toISOString()
            .replace(/[:.]/g, "-");

        if (tab === "links") {
            const headers = [
                "URL",
                "Status",
                "Broken",
                "Source Pages",
                "Example Source",
                "Error"
            ];

            const rows = state.linkResults.map(link => [
                link.url,
                link.status,
                link.broken,
                link.sourcePages.join(" | "),
                link.sourcePages[0] || "",
                link.error
            ]);

            downloadCSV(
                `neon-auditor-links-${timestamp}.csv`,
                headers,
                rows
            );

            return;
        }

        if (tab === "keywords") {
            const headers = [
                "Page URL",
                "Keyword",
                "Occurrences",
                "Snippet"
            ];

            const rows = state.keywordResults.map(item => [
                item.url,
                item.keyword,
                item.occurrences,
                item.snippet
            ]);

            downloadCSV(
                `neon-auditor-keywords-${timestamp}.csv`,
                headers,
                rows
            );

            return;
        }

        if (tab === "replace") {
            const headers = [
                "Page URL",
                "Find",
                "Replace",
                "Occurrences",
                "Preview"
            ];

            const rows = state.replaceResults.map(item => [
                item.url,
                item.find,
                item.replace,
                item.occurrences,
                item.preview
            ]);

            downloadCSV(
                `neon-auditor-replacements-${timestamp}.csv`,
                headers,
                rows
            );

            return;
        }

        if (tab === "errors") {
            const headers = [
                "URL",
                "Error"
            ];

            const rows = state.errors.map(error => [
                error.url,
                error.error
            ]);

            downloadCSV(
                `neon-auditor-errors-${timestamp}.csv`,
                headers,
                rows
            );

            return;
        }

        // Default export: all scanned pages.
        const headers = [
            "URL",
            "Title",
            "Meta Description",
            "Canonical",
            "Robots",
            "H1 Count",
            "H1 Headings",
            "Word Count",
            "Image Count",
            "Missing Image ALT",
            "Internal Link Count"
        ];

        const rows = state.pageResults.map(page => [
            page.url,
            page.title,
            page.metaDescription,
            page.canonical,
            page.robots,
            page.h1Count,
            page.headings.h1.join(" | "),
            page.wordCount,
            page.imageCount,
            page.missingAltCount,
            page.internalLinks.length
        ]);

        downloadCSV(
            `neon-auditor-pages-${timestamp}.csv`,
            headers,
            rows
        );
    }

    // ==========================================
    // PART 5: AUDIT RUNNER + EVENT LISTENERS
    // ==========================================

    // ==========================================
    // RESET AUDIT DATA
    // ==========================================

    function resetAuditData() {
        state.stop = false;

        state.pageResults = [];
        state.linkResults = [];
        state.keywordResults = [];
        state.replaceResults = [];
        state.errors = [];

        state.sitemapFiles = new Set();
        state.pageSet = new Set();
        state.internalLinks = new Map();

        state.discoveredCount = 0;
        state.scannedCount = 0;
    }

    // ==========================================
    // CLEAR RESULTS
    // ==========================================

    function clearResults() {
        if (state.scanning) {
            setStatus(
                "Stop the current scan before clearing results.",
                "warning"
            );
            return;
        }

        resetAuditData();

        setProgress(0, 1, "Ready");

        setStatus(
            "Results cleared. Ready for a new audit.",
            "info"
        );

        renderResults("overview");
    }

    // ==========================================
    // START AUDIT
    // ==========================================

    async function runAudit() {
        if (state.scanning) return;

        const sitemapInput = $("#sitemap");

        const sitemapUrl =
            sitemapInput?.value?.trim() ||
            defaultSitemap();

        if (!sitemapUrl) {
            setStatus(
                "Please enter a sitemap URL.",
                "warning"
            );
            return;
        }

        try {
            const parsedSitemap = new URL(sitemapUrl);

            if (
                !["http:", "https:"].includes(
                    parsedSitemap.protocol
                )
            ) {
                throw new Error("Invalid sitemap protocol.");
            }

        } catch (error) {
            setStatus(
                "Please enter a valid sitemap URL.",
                "error"
            );
            return;
        }

        const maxPagesInput =
            $("#maxPages") ||
            $("#max-pages") ||
            $("#pageLimit");

        const requestedMaxPages = Number(
            maxPagesInput?.value
        );

        state.maxPages = Math.max(
            1,
            Math.min(
                10000,
                Number.isFinite(requestedMaxPages) &&
                requestedMaxPages > 0
                    ? Math.floor(requestedMaxPages)
                    : 500
            )
        );

        if (maxPagesInput) {
            maxPagesInput.value = state.maxPages;
        }

        resetAuditData();

        setBusy(true);

        setProgress(0, 1, "Starting audit");

        setStatus(
            "Reading sitemap...",
            "info"
        );

        try {
            // ----------------------------------
            // STEP 1: READ SITEMAP
            // ----------------------------------

            await readSitemap(sitemapUrl);

            if (state.stop) {
                setStatus(
                    "Audit stopped while reading sitemap.",
                    "warning"
                );

                return;
            }

            const pageUrls = Array.from(
                state.pageSet
            );

            if (!pageUrls.length) {
                renderResults(
                    state.errors.length
                        ? "errors"
                        : "overview"
                );

                setStatus(
                    "No pages were discovered. Check the sitemap URL, proxy configuration, and errors.",
                    "error"
                );

                return;
            }

            // ----------------------------------
            // STEP 2: SCAN PAGES
            // ----------------------------------

            setStatus(
                `Found ${pageUrls.length} pages. Starting page analysis...`,
                "info"
            );

            setProgress(
                0,
                pageUrls.length,
                "Scanning pages"
            );

            await runPool(
                pageUrls,
                4,
                async (pageUrl, index) => {
                    if (state.stop) return;

                    await scanPage(pageUrl);

                    setProgress(
                        index + 1,
                        pageUrls.length,
                        "Scanning pages"
                    );
                }
            );

            if (state.stop) {
                setStatus(
                    "Page scanning stopped. Showing partial results.",
                    "warning"
                );

                addHistoryEntry();
                renderResults("overview");

                return;
            }

            // ----------------------------------
            // STEP 3: CHECK INTERNAL LINKS
            // ----------------------------------

            const totalLinks = state.internalLinks.size;

            if (totalLinks > 0) {
                setStatus(
                    `Checking ${totalLinks} internal links...`,
                    "info"
                );

                await checkInternalLinks();
            }

            if (state.stop) {
                setStatus(
                    "Link checking stopped. Showing partial results.",
                    "warning"
                );
            } else {
                setStatus(
                    "Audit completed successfully.",
                    "success"
                );
            }

            // ----------------------------------
            // STEP 4: SAVE HISTORY
            // ----------------------------------

            addHistoryEntry();

            // ----------------------------------
            // STEP 5: DISPLAY RESULTS
            // ----------------------------------

            renderResults("overview");

            const summary = getPageSummary();

            setProgress(
                1,
                1,
                "Audit complete"
            );

            if (!state.stop) {
                setStatus(
                    `Completed: ${state.pageResults.length} pages scanned, ` +
                    `${state.linkResults.length} links checked, ` +
                    `${summary.brokenLinks} broken links, ` +
                    `${state.errors.length} errors.`,
                    "success"
                );
            }

        } catch (error) {
            console.error(
                "Neon Website Auditor Error:",
                error
            );

            state.errors.push({
                url: sitemapUrl,
                error: error.message || "Unexpected audit error."
            });

            setStatus(
                error.message || "An unexpected error occurred.",
                "error"
            );

            renderResults("errors");

        } finally {
            setBusy(false);

            // Refresh the current tab and button states.
            renderResults(state.activeTab);
        }
    }

    // ==========================================
    // STOP AUDIT
    // ==========================================

    function stopAudit() {
        if (!state.scanning) return;

        state.stop = true;

        setStatus(
            "Stopping audit after the current requests finish...",
            "warning"
        );
    }

    // ==========================================
    // PANEL CONTROLS
    // ==========================================

    function setPanelOpen(open) {
        const panel = $("#panel");

        if (!panel) return;

        panel.hidden = !open;

        panel.classList.toggle(
            "open",
            open
        );

        panel.setAttribute(
            "aria-hidden",
            open ? "false" : "true"
        );
    }

    // ==========================================
    // EVENT LISTENERS
    // ==========================================

    function bindEvents() {
        // Start audit.
        const startButton = $("#start");

        if (startButton) {
            startButton.addEventListener(
                "click",
                runAudit
            );
        }

        // Stop audit.
        const stopButton = $("#stop");

        if (stopButton) {
            stopButton.addEventListener(
                "click",
                stopAudit
            );
        }

        // Export results.
        const exportButton = $("#export");

        if (exportButton) {
            exportButton.addEventListener(
                "click",
                exportResults
            );
        }

        // Clear results.
        const clearButton =
            $("#clear") ||
            $("#clearResults");

        if (clearButton) {
            clearButton.addEventListener(
                "click",
                clearResults
            );
        }

        // Save Cloudflare Worker URL.
        const proxyInput = $("#proxyUrl");

        if (proxyInput) {
            const savedProxy = storageGet(
                PROXY_KEY,
                ""
            );

            if (!proxyInput.value && savedProxy) {
                proxyInput.value = savedProxy;
            }

            proxyInput.addEventListener(
                "change",
                () => {
                    storageSet(
                        PROXY_KEY,
                        proxyInput.value.trim()
                    );
                }
            );

            proxyInput.addEventListener(
                "input",
                () => {
                    storageSet(
                        PROXY_KEY,
                        proxyInput.value.trim()
                    );
                }
            );
        }

        // Tab navigation.
        shadow.addEventListener(
            "click",
            event => {
                const tabButton = event.target.closest(
                    "[data-tab]"
                );

                if (!tabButton) return;

                const tab = tabButton.getAttribute(
                    "data-tab"
                );

                if (!tab) return;

                renderResults(tab);
            }
        );

        // Open panel.
        const launcher =
            $("#launcher") ||
            $("#toggle") ||
            shadow.querySelector(
                '[data-action="toggle"]'
            );

        if (launcher) {
            launcher.addEventListener(
                "click",
                () => {
                    const panel = $("#panel");

                    if (!panel) return;

                    const isOpen =
                        !panel.hidden &&
                        panel.classList.contains("open");

                    setPanelOpen(!isOpen);
                }
            );
        }

        // Close panel.
        const closeButton =
            $("#close") ||
            $("#closePanel") ||
            shadow.querySelector(
                '[data-action="close"]'
            );

        if (closeButton) {
            closeButton.addEventListener(
                "click",
                () => setPanelOpen(false)
            );
        }

        // Close panel with Escape.
        shadow.addEventListener(
            "keydown",
            event => {
                if (event.key === "Escape") {
                    setPanelOpen(false);
                }
            }
        );
    }

    // ==========================================
    // INITIALIZE AUDITOR
    // ==========================================

    function initializeAuditor() {
        // Ensure the root is attached to the document.
        if (!root.isConnected) {
            document.body.appendChild(root);
        }

        // Restore saved settings.
        const proxyInput = $("#proxyUrl");

        if (proxyInput) {
            proxyInput.value =
                storageGet(PROXY_KEY, "") ||
                proxyInput.value ||
                "";
        }

        // Load previous audit history.
        loadHistory();

        // Connect all buttons and controls.
        bindEvents();

        // Set initial interface state.
        setBusy(false);

        setProgress(
            0,
            1,
            "Ready"
        );

        setStatus(
            "Ready to scan.",
            "info"
        );

        // Show the overview.
        renderResults("overview");

        console.log(
            "Neon Website Auditor V4 initialized successfully."
        );
    }

    // ==========================================
    // RUN INITIALIZATION
    // ==========================================

    initializeAuditor();

}

// Start the auditor only when the page DOM is ready.
if (document.readyState === "loading") {
    document.addEventListener(
        "DOMContentLoaded",
        initAuditor,
        { once: true }
    );
} else {
    initAuditor();
}

})();

    </script>
  </head>

    <p>Hello</p>
  </body>
