<html>
  <head>
    <script>
      (function () {
  "use strict";

  const INSTANCE = "__NEON_WEBSITE_AUDITOR_V3__";

  if (window[INSTANCE]) {
    window[INSTANCE].open();
    return;
  }

  function initAuditor() {
    if (window[INSTANCE]) return;

    const root = document.createElement("div");
    root.id = "neon-website-auditor-root";
    document.body.appendChild(root);

    const shadow = root.attachShadow({ mode: "open" });

    shadow.innerHTML = `
      <style>
        :host {
          all: initial;
          position: fixed;
          right: 18px;
          bottom: 18px;
          z-index: 2147483000;
          font-family: Arial, sans-serif;
          color: #e8f5e9;
        }

        * {
          box-sizing: border-box;
        }

        #launcher {
          background: #a6ff00;
          color: #101600;
          border: 0;
          border-radius: 30px;
          padding: 13px 19px;
          font-weight: 900;
          font-size: 13px;
          cursor: pointer;
          box-shadow: 0 0 18px rgba(166,255,0,.45);
        }

        #panel {
          position: absolute;
          right: 0;
          bottom: 58px;
          width: min(780px, calc(100vw - 28px));
          max-height: min(850px, calc(100vh - 100px));
          background: #0b100d;
          border: 1px solid #456d16;
          border-radius: 15px;
          box-shadow: 0 0 35px rgba(0,0,0,.65),
                      0 0 15px rgba(166,255,0,.12);
          overflow: hidden;
          display: flex;
          flex-direction: column;
        }

        #panel[hidden] {
          display: none !important;
        }

        .header {
          padding: 16px;
          background: linear-gradient(110deg, #111b0c, #101510);
          border-bottom: 1px solid #304b1b;
          display: flex;
          justify-content: space-between;
          align-items: center;
        }

        .header h2 {
          margin: 0;
          color: #a6ff00;
          font-size: 16px;
          letter-spacing: 1px;
        }

        .header small {
          display: block;
          color: #809477;
          font-size: 10px;
          margin-top: 4px;
        }

        button {
          font-family: inherit;
        }

        .close {
          background: transparent;
          border: 0;
          color: #a6ff00;
          font-size: 22px;
          cursor: pointer;
        }

        .settings {
          padding: 14px;
          display: grid;
          grid-template-columns: 1fr 110px;
          gap: 10px;
          border-bottom: 1px solid #243321;
        }

        .field {
          display: flex;
          flex-direction: column;
          gap: 5px;
        }

        .field.full {
          grid-column: 1 / -1;
        }

        label {
          font-size: 10px;
          color: #a6ff00;
          font-weight: bold;
          letter-spacing: .5px;
        }

        input, textarea {
          width: 100%;
          background: #111a13;
          color: #e8f5e9;
          border: 1px solid #344b2c;
          border-radius: 6px;
          padding: 9px;
          font-size: 12px;
          outline: none;
          min-width: 0;
        }

        input:focus, textarea:focus {
          border-color: #a6ff00;
          box-shadow: 0 0 0 2px rgba(166,255,0,.08);
        }


    </script>
  </head>
  <body>
    
  </body>
</html>
